name: Deploy to Firebase Hosting (Demo Template)

on:
  push:
    branches:
      - demo # Triggers when pushing to the demo branch

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm ci

      - name: Create .env file for Demo Template
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.DEMO_FIREBASE_API_KEY }}" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.DEMO_FIREBASE_PROJECT_ID }}.firebaseapp.com" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.DEMO_FIREBASE_PROJECT_ID }}" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.DEMO_FIREBASE_PROJECT_ID }}.appspot.com" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.DEMO_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "VITE_FIREBASE_APP_ID=${{ secrets.DEMO_FIREBASE_APP_ID }}" >> .env
          echo "VITE_RECAPTCHA_SITE_KEY=${{ secrets.DEMO_RECAPTCHA_SITE_KEY }}" >> .env
          echo "VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.DEMO_FIREBASE_MEASUREMENT_ID }}" >> .env
          echo "VITE_ADMIN_EMAILS=${{ secrets.DEMO_ADMIN_EMAILS }}" >> .env
          echo "VITE_SENTRY_DSN=${{ secrets.DEMO_SENTRY_DSN }}" >> .env
          echo "VITE_FIREBASE_DATABASE_ID=(default)" >> .env

      - name: Build Project
        run: npm run build

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting,firestore:rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
