name: Deploy to Firebase Hosting (Tandoori House)

on:
  push:
    branches:
      - Tandoori-House # Triggers when pushing to the Tandoori-House branch

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm ci

      - name: Create .env file for Tandoori House
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.TANDOORI_FIREBASE_API_KEY }}" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.TANDOORI_FIREBASE_PROJECT_ID }}.firebaseapp.com" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.TANDOORI_FIREBASE_PROJECT_ID }}" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.TANDOORI_FIREBASE_PROJECT_ID }}.appspot.com" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.TANDOORI_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "VITE_FIREBASE_APP_ID=${{ secrets.TANDOORI_FIREBASE_APP_ID }}" >> .env
          echo "VITE_RECAPTCHA_SITE_KEY=${{ secrets.TANDOORI_RECAPTCHA_SITE_KEY }}" >> .env
          echo "VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.TANDOORI_FIREBASE_MEASUREMENT_ID }}" >> .env
          echo "VITE_ADMIN_EMAILS=${{ secrets.TANDOORI_ADMIN_EMAILS }}" >> .env
          echo "VITE_SENTRY_DSN=${{ secrets.TANDOORI_SENTRY_DSN }}" >> .env
          echo "VITE_FIREBASE_DATABASE_ID=database" >> .env

      - name: Build Project
        run: npm run build

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting --project ${{ secrets.TANDOORI_FIREBASE_PROJECT_ID }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
