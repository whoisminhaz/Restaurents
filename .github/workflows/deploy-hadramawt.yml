name: Deploy to Firebase Hosting (Hadramawt)

on:
  push:
    branches:
      - hadramawt # Only triggers when pushing to the hadramawt branch

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm ci

      - name: Create .env file for Hadramawt
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.HADRAMAWT_FIREBASE_API_KEY }}" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=hadramawth-f58ba.firebaseapp.com" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=hadramawth-f58ba" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=hadramawth-f58ba.appspot.com" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.HADRAMAWT_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "VITE_FIREBASE_APP_ID=${{ secrets.HADRAMAWT_FIREBASE_APP_ID }}" >> .env
          echo "VITE_RECAPTCHA_SITE_KEY=${{ secrets.HADRAMAWT_RECAPTCHA_SITE_KEY }}" >> .env
          echo "VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.HADRAMAWT_FIREBASE_MEASUREMENT_ID }}" >> .env
          echo "VITE_ADMIN_EMAILS=${{ secrets.HADRAMAWT_ADMIN_EMAILS }}" >> .env
          echo "VITE_SENTRY_DSN=${{ secrets.HADRAMAWT_SENTRY_DSN }}" >> .env

      - name: Build Project
        run: npm run build

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting,firestore:rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
